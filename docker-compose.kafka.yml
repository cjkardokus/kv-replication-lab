# Single-node Kafka broker for the message-queue replication strategy
# (message_queue/, built and integrated -- see README.md for the strategy
# itself). This file backs local dev: `message_queue/` nodes,
# `experiments/kafka_smoke_test.py`, and `tests/test_message_queue.py`'s
# kafka_integration-marked tests all connect to whatever broker this
# starts. CI runs its own separate, ephemeral Kafka service container
# (see .github/workflows/tests.yml's test-mq job) rather than this
# compose file -- see docs/kafka-setup.md for the full broker-lifecycle
# picture.
#
# KRaft mode (no ZooKeeper): a single container plays both the
# "controller" and "broker" roles, which is the current standard way to
# run Kafka locally -- ZooKeeper mode is deprecated and removed outright
# in Kafka 4.x. apache/kafka is the official upstream image (as opposed
# to a third-party distribution like confluentinc/cp-kafka) and ships
# KRaft-only starting with the same 4.x line, so there's no "which mode"
# footgun: this image cannot start in ZooKeeper mode even by accident.
#
# Deliberately NOT managed by run_comparison.py or any test harness --
# unlike the leader_follower/leaderless node processes (spawned fresh
# per config, torn down after), this broker is meant to be started once
# and left running across many runs, the way a developer would run a
# real Kafka cluster. Start/stop it yourself; see docs/kafka-setup.md.
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kv-lab-kafka
    ports:
      # Host-run Python processes (the smoke test now, message_queue/
      # nodes later) connect here as plain localhost:9092 -- no other
      # container needs to reach this broker, so there's no separate
      # internal-vs-external advertised-listener split to maintain.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is the client-facing listener; CONTROLLER is KRaft's
      # own internal quorum protocol, never used by Kafka clients (this
      # is why aiokafka doesn't need to know it exists).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker, so replication factor 1 everywhere -- there is
      # nothing else to replicate an internal topic to. Not related to
      # the KV-store replication this project studies; these govern
      # Kafka's own internal bookkeeping topics only.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No consumer groups exist yet to rebalance -- this only shortens
      # the wait once message_queue/ followers show up in branch 2.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The image's own default log dir is /tmp/kraft-combined-logs
      # (see /etc/kafka/docker/server.properties) -- pointed here
      # explicitly, matching the volume mount below, rather than
      # relying on that undocumented default to line up with wherever
      # the volume happens to be mounted.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Persists the log across `docker compose down`/`up` (but not
      # `down -v`) -- restarting shouldn't silently discard whatever
      # topics/messages were produced in a prior session. The startup
      # script (kafka.docker.KafkaDockerWrapper) detects an
      # already-formatted log dir here and skips reformatting, so a
      # restart resumes the existing cluster/topics instead of
      # silently starting a fresh one.
      - kv-lab-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kv-lab-kafka-data:
